name: Android OTA update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/App.tsx'
      - 'apps/mobile/src/**'
      - '.github/workflows/native-ota.yml'

concurrency:
  group: hometayo-android-ota
  cancel-in-progress: true

jobs:
  publish-update:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: 'https://hometayoph.vercel.app'
      EAS_PROJECT_ID: '55714287-6e36-4377-8807-460f5027bd7c'
      EAS_UPDATE_CHANNEL: 'preview'
      APP_VERSION: '0.5.0'
      REQUIRE_EAS_UPDATES: 'true'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Verify OTA credentials
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is missing. Add it as the GitHub Actions secret EXPO_TOKEN."
            exit 1
          fi
          echo "Publishing HomeTayo ${APP_VERSION} OTA to project ${EAS_PROJECT_ID} on ${EAS_UPDATE_CHANNEL}."

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Type check native app
        working-directory: apps/mobile
        run: npm run check

      - name: Verify OTA runtime
        working-directory: apps/mobile
        run: |
          npx expo config --type public > /tmp/expo-config.txt
          grep -E '0.5.0|runtimeVersion|u.expo.dev|expo-channel-name|preview' /tmp/expo-config.txt

      - name: Publish Android OTA update
        working-directory: apps/mobile
        run: npx eas-cli@latest update --channel "$EAS_UPDATE_CHANNEL" --platform android --message "GitHub ${GITHUB_SHA}" --non-interactive
