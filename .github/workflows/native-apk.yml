name: Android native APK baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/app.json'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/assets/icon.png'
      - 'apps/mobile/assets/adaptive-icon.png'
      - '.github/workflows/native-apk.yml'
  pull_request:
    paths:
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/app.json'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - 'apps/mobile/assets/icon.png'
      - 'apps/mobile/assets/adaptive-icon.png'
      - '.github/workflows/native-apk.yml'

permissions:
  contents: write

concurrency:
  group: hometayo-android-latest
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://hometayoph.vercel.app
      NODE_OPTIONS: --max-old-space-size=4096
      EAS_PROJECT_ID: 55714287-6e36-4377-8807-460f5027bd7c
      EAS_UPDATE_CHANNEL: production
      REQUIRE_EAS_UPDATES: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify OTA project link
        run: |
          test -n "$EAS_PROJECT_ID"
          echo "Building OTA-enabled HomeTayo 0.4.0 on channel ${EAS_UPDATE_CHANNEL}"

      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK ready"

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install --no-audit --no-fund

      - name: Type check native app
        working-directory: apps/mobile
        run: npm run check

      - name: Validate Android JavaScript bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-ci --clear

      - name: Set unique Android build code
        run: |
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "Android versionCode: $((1000 + GITHUB_RUN_NUMBER)); app/runtime version: 0.4.0"

      - name: Verify Expo OTA configuration
        working-directory: apps/mobile
        run: |
          npx expo config --type public > /tmp/expo-config.txt
          grep -E 'version|versionCode|runtimeVersion|updates|u.expo.dev|expo-channel-name|production' /tmp/expo-config.txt

      - name: Create native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean

      - name: Verify Expo native autolinking
        working-directory: apps/mobile
        run: npx expo-modules-autolinking resolve --platform android --json > /tmp/expo-autolinking.json

      - name: Configure Gradle memory
        working-directory: apps/mobile/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          sed -i '/^kotlin.daemon.jvmargs=/d' gradle.properties
          sed -i '/^org.gradle.workers.max=/d' gradle.properties
          printf '\n%s\n' \
            'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' \
            'kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m' \
            'org.gradle.workers.max=2' >> gradle.properties
          grep -E '^(org.gradle.jvmargs|kotlin.daemon.jvmargs|org.gradle.workers.max)=' gradle.properties

      - name: Build standalone Android APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --build-cache --max-workers=2 --stacktrace

      - name: Prepare branded APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk HomeTayo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hometayo-android-latest
          path: HomeTayo.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable latest APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest HomeTayo.apk --clobber
            gh release edit android-latest \
              --title "HomeTayo Android — Latest" \
              --notes "OTA-ready HomeTayo 0.4.0 baseline from main. Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}."
          else
            gh release create android-latest HomeTayo.apk \
              --target "$GITHUB_SHA" \
              --title "HomeTayo Android — Latest" \
              --notes "OTA-ready HomeTayo 0.4.0 baseline from main. Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}."
          fi

      - name: Verify public APK release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android-latest" --jq '.assets[] | select(.name == "HomeTayo.apk") | .browser_download_url')"
          test -n "$APK_URL"
          echo "Published HomeTayo.apk: $APK_URL"
