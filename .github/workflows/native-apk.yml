name: Android native APK preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'app/api/mobile/**'
      - 'app/api/public/listings/**'
      - 'lib/rental-operation-*.ts'
      - 'lib/rental-operations.ts'
      - '.github/workflows/native-apk.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'app/api/mobile/**'
      - 'app/api/public/listings/**'
      - '.github/workflows/native-apk.yml'

permissions:
  contents: write

concurrency:
  group: hometayo-android-latest
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://hometayoph.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms" && echo "Android SDK ready"

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Type check native app
        working-directory: apps/mobile
        run: npm run check

      - name: Set unique Android build version
        run: |
          echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "APP_VERSION=0.3.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Building HomeTayo 0.3.${GITHUB_RUN_NUMBER} ($((1000 + GITHUB_RUN_NUMBER)))"

      - name: Verify Expo resolved version
        working-directory: apps/mobile
        run: npx expo config --type public | grep -E 'version|versionCode'

      - name: Create native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build standalone Android APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon --build-cache --parallel

      - name: Prepare branded APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk HomeTayo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hometayo-android-latest
          path: HomeTayo.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable latest APK release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest HomeTayo.apk --clobber
            gh release edit android-latest \
              --title "HomeTayo Android — Latest" \
              --notes "Latest HomeTayo Android build from main. Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}."
          else
            gh release create android-latest HomeTayo.apk \
              --target "$GITHUB_SHA" \
              --title "HomeTayo Android — Latest" \
              --notes "Latest HomeTayo Android build from main. Build ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA}."
          fi

      - name: Verify public APK release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/android-latest" --jq '.assets[] | select(.name == "HomeTayo.apk") | .browser_download_url')"
          test -n "$APK_URL"
          echo "Published HomeTayo.apk: $APK_URL"
